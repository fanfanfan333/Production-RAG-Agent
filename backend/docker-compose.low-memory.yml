# Local CPU profile; keep the main deployment defaults unchanged.
# Keep the RAG evidence window; save memory through model size and concurrency.
services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
  qdrant:
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
  backend:
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "2"
    environment:
      OLLAMA_MODEL: qwen3:4b-instruct-2507-q4_K_M
      OLLAMA_NUM_CTX: "8192"
      OLLAMA_NUM_GPU: "0"
      OLLAMA_KEEP_ALIVE_SECONDS: "0"
      MAX_CONCURRENT_EMBEDDINGS: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ROUTER_TIMEOUT_SECONDS: "30"
      QUERY_REWRITE_TIMEOUT_SECONDS: "30"
      RETRIEVAL_GRADER_TIMEOUT_SECONDS: "30"
